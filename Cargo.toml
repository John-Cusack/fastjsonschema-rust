[workspace]
members = ["fastjsonschema-core"]
resolver = "2"

[package]
name = "fastjsonschema-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the fastjsonschema-rust port"
license = "BSD-3-Clause"
repository = "https://github.com/John-Cusack/fastjsonschema-rust"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
fastjsonschema-core = { version = "0.1.0", path = "fastjsonschema-core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
