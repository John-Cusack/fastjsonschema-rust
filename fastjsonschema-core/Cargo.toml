[package]
name = "fastjsonschema-core"
version = "0.1.0"
edition = "2021"
description = "Plan IR for the fastjsonschema-rust validation kernel"
license = "BSD-3-Clause"
repository = "https://github.com/John-Cusack/fastjsonschema-rust"

[dependencies]
pyo3 = { version = "0.24", features = ["auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
